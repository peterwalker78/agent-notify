# agent-notify as a plugin for Slipstream's plugin panel: a card with your agents' plan limits.
# The card only reads the folders below, the cached limits and the config saying which agents to
# show; the agents' hooks do the rest.
name = "Agents"
description = "Your coding agents' plan limits"
exec = ["bin/agent-notify", "card"]
read = ["$XDG_CACHE_HOME/agent-notify", "$XDG_CONFIG_HOME/agent-notify"]
